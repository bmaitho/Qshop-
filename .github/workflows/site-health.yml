# Checks every 6 hours that unihive.shop and www.unihive.shop load over
# HTTPS with valid certificates (one redirects to the other), the certificates
# aren't about to expire, and the backend API is up. A failed run emails the repo owner (GitHub's
# default notification), so we hear about it before customers do.
name: Site health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: www and apex both work (one redirects to the other)
        run: |
          for host in unihive.shop www.unihive.shop; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/")
            echo "$host -> $code (after redirects)"
            test "$code" = "200" || { echo "::error::$host does not load over a valid HTTPS certificate"; exit 1; }
          done

      - name: Certificate valid for at least 14 more days
        run: |
          for host in unihive.shop www.unihive.shop; do
            end=$(echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$host certificate expires $end ($days days)"
            if [ "$days" -lt 14 ]; then echo "::error::$host certificate expires in $days days"; exit 1; fi
          done


      - name: Backend API (Render) is up
        run: |
          # Free/suspended Render services can take a while to wake; allow 60s.
          body=$(curl -sS --max-time 60 https://unihive-wba0.onrender.com/api/health || true)
          echo "backend -> $body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::Backend API on Render is not responding (check Render billing/status)"; exit 1; }
